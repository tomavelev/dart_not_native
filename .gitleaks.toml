# gitleaks configuration for dart_not_native.
#
# Starts from the default rules and narrows them where this repository has a
# string that looks like a credential and is not one. Each exception says why;
# an allowlist without a reason is how a real secret eventually gets ignored.

[extend]
useDefault = true

[[rules]]
id = "jwt"
description = "JWT"
regex = '''\beyJ[A-Za-z0-9_\/+-]{10,}={0,2}\.[A-Za-z0-9_\/+-]{10,}={0,2}\.[A-Za-z0-9_\/+-]{10,}={0,2}'''
keywords = ["eyJ"]

[allowlist]
description = "Strings that look like credentials and are not"
paths = [
  # The signing template. It says YOUR_TEAM_ID, and a real team id is caught
  # by its own check in the Quality workflow rather than by pattern matching.
  '''ios/Flutter/Signing\.xcconfig\.example''',
]
# No regex exceptions. The storage example used to write values shaped like a
# live Stripe key and a JWT; gitleaks was right to object, so the example was
# changed rather than the scanner silenced. An example that ships a
# credential-shaped string teaches the shape and trips every scanner its
# readers run.
