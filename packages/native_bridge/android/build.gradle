group = "com.programtom.dart_not_native"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.programtom.dart_not_native"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    // The renderer builds AppCompat and Material views; the plugin registers
    // an OnBackPressedCallback for the system back gesture. Declaring them
    // here is what saves every consuming app from doing it.
    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    // Pull-to-refresh on a Scroll node. Material does not bring it along.
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
}
