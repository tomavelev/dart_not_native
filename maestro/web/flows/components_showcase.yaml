# Component showcase (lib/examples/apps/components_showcase_app.dart)
url: ${BASE_URL}/components_showcase/?kit=${KIT}&animations=off
tags:
  - web
  - showcase
---
- launchApp
- extendedWaitUntil:
    visible:
      id: page_indicator
    timeout: 20000
- assertVisible: "Component Showcase \\(Page 1/3\\)"
- assertVisible: "📐 Layout Components"
- assertVisible: "✓ Scaffold"
- assertVisible:
    id: page_indicator
    text: "Page 1 of 3"
- runFlow:
    file: subflows/snap.yaml
    env:
      NAME: components_showcase/01_layout_page

# Page 2: components, with the counter
- tapOn:
    id: next_page
- assertVisible: "Component Showcase \\(Page 2/3\\)"
- assertVisible: "🎨 Basic Components"
- assertVisible:
    id: counter_value
    text: "Counter Value: 0"
- tapOn:
    id: Increment
- tapOn:
    id: Increment
- assertVisible:
    id: counter_value
    text: "Counter Value: 2"
- assertVisible:
    id: tap_count
    text: "Tap Count: 2"
- tapOn:
    id: decrement
- assertVisible:
    id: counter_value
    text: "Counter Value: 1"
- runFlow:
    file: subflows/snap.yaml
    env:
      NAME: components_showcase/02_components_page

# Page 3: rich components, incl. the native feature list
- tapOn:
    id: next_page
- assertVisible: "Component Showcase \\(Page 3/3\\)"
- assertVisible: "🎯 Rich Components"
- assertVisible: "Native platform components"
- assertVisible: "UIKit · Android Views · DOM"
- runFlow:
    file: subflows/snap.yaml
    env:
      NAME: components_showcase/03_rich_page

# This page is taller than the viewport; Maestro only sees what is on screen.
- scrollUntilVisible:
    element:
      id: next_page
    direction: DOWN
    timeout: 15000

# Wraps around to page 1, and back to page 3
- tapOn:
    id: next_page
- assertVisible: "Component Showcase \\(Page 1/3\\)"
- tapOn:
    id: prev_page
- assertVisible: "Component Showcase \\(Page 3/3\\)"

# Counter state survives page changes
- scrollUntilVisible:
    element:
      id: prev_page
    direction: DOWN
    timeout: 15000
- tapOn:
    id: prev_page
- assertVisible:
    id: counter_value
    text: "Counter Value: 1"
