# Android counter (lib/examples/apps/android_native_counter_app.dart)
url: ${BASE_URL}/android_native_counter/?kit=${KIT}&animations=off
tags:
  - web
  - android
  - counter
---
- launchApp
- extendedWaitUntil:
    visible:
      id: count
    timeout: 20000
- assertVisible: "Counter App"
- assertVisible: "You have pushed the button this many times:"
- assertVisible:
    id: count
    text: "0"
- runFlow:
    file: subflows/snap.yaml
    env:
      NAME: android_native_counter/01_initial

# FAB increments
- tapOn:
    id: Increment
- tapOn:
    id: Increment
- tapOn:
    id: Increment
- assertVisible:
    id: count
    text: "3"
- runFlow:
    file: subflows/snap.yaml
    env:
      NAME: android_native_counter/02_incremented

# Decrement, then reset
- tapOn:
    id: decrement
- assertVisible:
    id: count
    text: "2"
- tapOn:
    id: reset
- assertVisible:
    id: count
    text: "0"

# Decrement never goes below zero
- tapOn:
    id: decrement
- assertVisible:
    id: count
    text: "0"
