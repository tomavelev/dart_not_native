name: Native

# Compiles the Kotlin and Swift renderers. Nothing here boots a device, and
# nothing in CI does: the simulator and emulator lanes took tens of minutes
# and were the only lanes that ever hung, so that work is `tool/device_check.sh`,
# run on a machine that already has the device.
#
# So these run when something that can break them changes, rather than always.
# The paths below are chosen from what has actually broken them: the renderers
# themselves, the host projects (an iOS Info.plist once stopped the app
# launching at all), the protocol, the flows, and the example apps the flows
# drive. A docs-only or test-only commit skips this workflow entirely.
#
# A compile is the cheap half and stays on the paths that can break it - the
# Swift renderer once sat uncompilable for two commits, which is what this
# catches. What it cannot catch is an app that compiles and then refuses to
# launch: the iOS 26 UIScene failure did exactly that, and only a lane that
# starts the app would have seen it. `tool/device_check.sh` is that check, and
# it is something you run rather than something that runs on every push.
#
# Fifteen minutes each, now that both only compile - the Android lane takes
# about five and the iOS one under three. A timeout is meant to bound a hang
# (a step once ran 54 minutes before anyone noticed), not to cut off work that
# is proceeding: when the iOS lane also booted a simulator, fifteen cancelled
# it at 15m48s on its last step with everything before it green. If one of
# these starts timing out while making real progress, split it rather than
# add minutes.

on:
  push:
    branches: [main]
    # Duplicated below rather than shared with a YAML anchor: GitHub's
    # workflow parser does not support anchors, so the tidy version does not
    # run at all.
    paths:
      - 'packages/native_bridge/android/**'
      - 'packages/native_bridge/ios/**'
      - 'packages/native_bridge/lib/**'
      - 'packages/native_bridge/pubspec.yaml'
      - 'android/**'
      - 'ios/**'
      - 'lib/**'
      - 'integration_test/**'
      - 'maestro/native/**'
      - 'pubspec.yaml'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'packages/native_bridge/android/**'
      - 'packages/native_bridge/ios/**'
      - 'packages/native_bridge/lib/**'
      - 'packages/native_bridge/pubspec.yaml'
      - 'android/**'
      - 'ios/**'
      - 'lib/**'
      - 'integration_test/**'
      - 'maestro/native/**'
      - 'pubspec.yaml'
      - '.github/workflows/native.yml'
  schedule:
    # Nightly, so the lanes stay honest between native changes.
    - cron: '0 3 * * *'
  workflow_dispatch:


# Only the newest run of a workflow per branch is worth finishing: an older one
# is testing a commit nobody will look at again. Without this they pile up -
# four were in flight at once, two of them superseded - and on a free account
# they queue behind each other as well as burning time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  android-build:
    name: Android native compile
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Compiles the Kotlin renderer and every plugin's Android half — the lane
      # that would have caught the BackgroundTasksPlugin and SwitchCompat breaks.
      - name: Build debug APK
        run: flutter build apk --debug

  ios-build:
    name: iOS native compile
    # Fifteen is enough now that it only compiles. It needed thirty when it
    # also booted a simulator and drove the flows; that work is
    # tool/device_check.sh now.
    timeout-minutes: 15
    # Xcode only exists on the macOS runners, which is why this lane was missing
    # and why the Swift renderer could sit un-compiled through several commits
    # (the swipe-actions change left it failing on a missing `override`).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The simulator build compiles NativeUIRenderer.swift and every plugin's
      # iOS half without needing a signing identity.
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign
