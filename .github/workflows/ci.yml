name: CI

# Runs the test lanes the project has (unit, widget/native-UI, DOM in a real
# browser, integration on the Linux desktop host and on an Android emulator)
# plus the Android and iOS native compiles, so a change that breaks any one of
# them is caught automatically.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    name: Analyze & test (Dart + Flutter + DOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version

      - name: Get packages
        run: |
          flutter pub get
          (cd packages/native_bridge && flutter pub get)

      # The shipping libraries carry pre-existing style infos; gate on real
      # problems (errors and warnings) so a regression fails the build without
      # the lint backlog making it permanently red.
      - name: Analyze
        run: flutter analyze --no-fatal-infos lib packages/native_bridge/lib

      - name: Framework unit + Flutter-renderer tests
        working-directory: packages/native_bridge
        run: flutter test

      - name: Example, golden and Flutter-render tests
        run: flutter test

      # test/web_ui and the DOM goldens render real elements, so they need a
      # browser. ubuntu-latest ships Chrome.
      - name: DOM tests (Chrome)
        working-directory: packages/native_bridge
        run: flutter test --platform chrome test/web_ui

  integration-linux:
    name: Integration (Linux desktop host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - name: Run integration_test headless
        run: xvfb-run -a flutter test integration_test -d linux

  android-build:
    name: Android native compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Compiles the Kotlin renderer and every plugin's Android half — the lane
      # that would have caught the BackgroundTasksPlugin and SwitchCompat breaks.
      - name: Build debug APK
        run: flutter build apk --debug

  ios-build:
    name: iOS native compile
    # Xcode only exists on the macOS runners, which is why this lane was missing
    # and why the Swift renderer could sit un-compiled through several commits
    # (the swipe-actions change left it failing on a missing `override`).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The simulator build compiles NativeUIRenderer.swift and every plugin's
      # iOS half without needing a signing identity.
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign

      # And then runs it: the Swift renderer draws one of every node type and
      # all ten example apps, which compiling alone never checks. The iOS half
      # is the least device-verified one, so this is the lane that matters
      # most for it.
      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E '^ +iPhone' | head -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"

      - name: Native renderer on the simulator
        run: flutter test integration_test -d "$SIMULATOR_UDID"

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Device flows on the simulator
        # The only lane that checks a tap or a keystroke *reaches* the app:
        # Maestro drives the real views through the accessibility tree.
        run: maestro/native/run.sh ios --device "$SIMULATOR_UDID"

  android-device:
    name: Native renderer on an Android emulator
    runs-on: ubuntu-latest
    # The Kotlin and Swift renderers are otherwise only read (the source-level
    # node-type check) and compiled. Neither notices a renderer that builds,
    # dispatches on every type, and then throws when handed one - a wrong
    # LayoutParams, an un-themed context. This lane draws one of every node
    # type and all ten example apps on a real Android, and a native render
    # answers with what it could not draw.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Without KVM the emulator falls back to software rendering and the boot
      # takes long enough to time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Integration tests and device flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Both integration files (the Flutter-hosted app and the native
          # renderer drawing the whole protocol), then the Maestro flows -
          # which are the only thing here that checks a tap or a keystroke
          # *reaches* the app rather than that a view was drawn.
          script: |
            flutter test integration_test
            maestro/native/run.sh android

  benchmarks:
    name: Benchmarks (recorded, not gated)
    runs-on: ubuntu-latest
    # The numbers belong to the runner as much as to the code, so this lane
    # records rather than gates: it keeps every BENCH_JSON line as an
    # artifact, and two runs of the same commit are what a comparison is made
    # from. The properties that *do* survive a change of machine are asserted
    # in the ordinary suites (scaling_test.dart, render_cost_test.dart).
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/native_bridge

      - name: Run the benchmarks
        working-directory: packages/native_bridge
        run: |
          mkdir -p ../../build/benchmarks
          flutter test test/benchmark/tree_build_benchmark.dart \
            | tee ../../build/benchmarks/tree_build.log
          flutter test --platform chrome test/benchmark/web_render_benchmark.dart \
            | tee ../../build/benchmarks/web_render.log
          grep -h '^BENCH_JSON ' ../../build/benchmarks/*.log \
            | sed 's/^BENCH_JSON //' > ../../build/benchmarks/results.jsonl

      - name: Keep the numbers
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/benchmarks/

  web-examples:
    name: Web examples compile
    runs-on: ubuntu-latest
    # The web target is plain dart2js against package:dart_not_native/web.dart,
    # which no other lane compiles: the browser tests exercise the renderer,
    # not the entry points. That let runNativeApp's web signature drift from
    # the Flutter one until every web example stopped building, unnoticed.
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build every web example
        run: maestro/web/build_examples.sh
