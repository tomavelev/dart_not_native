name: CI

# The lanes that are quick enough to wait for: analyze, the three test suites,
# integration on the Linux desktop host, the web examples and the benchmarks.
# Together they take about three minutes.
#
# The native lanes live in `native.yml` and do not run here. They were 85% of
# the wall clock - an iOS compile is 12 minutes and an emulator boot 11 - to
# check things that only break when native code changes, so they are triggered
# by the paths that can break them instead of by every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:


# Only the newest run of a workflow per branch is worth finishing: an older one
# is testing a commit nobody will look at again. Without this they pile up -
# four were in flight at once, two of them superseded - and on a free account
# they queue behind each other as well as burning time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  test:
    name: Analyze & test (Dart + Flutter + DOM)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version

      - name: Get packages
        run: |
          flutter pub get
          (cd packages/native_bridge && flutter pub get)

      # The shipping libraries carry pre-existing style infos; gate on real
      # problems (errors and warnings) so a regression fails the build without
      # the lint backlog making it permanently red.
      - name: Analyze
        run: flutter analyze --no-fatal-infos lib packages/native_bridge/lib

      - name: Framework unit + Flutter-renderer tests
        working-directory: packages/native_bridge
        run: flutter test

      - name: Example, golden and Flutter-render tests
        run: flutter test

      # test/web_ui and the DOM goldens render real elements, so they need a
      # browser. ubuntu-latest ships Chrome.
      - name: DOM tests (Chrome)
        working-directory: packages/native_bridge
        run: flutter test --platform chrome test/web_ui

  integration-linux:
    name: Integration (Linux desktop host)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      # One invocation per file. A desktop host cannot start a second app
      # inside one `flutter test integration_test` run - the first launches,
      # the second answers "the log reader stopped unexpectedly, or never
      # started" - and it is the runner doing that, not the tests: each file
      # passes on its own, and the same failure reproduces on macOS, so it is
      # not xvfb or the Linux runner either.
      - name: Run integration_test headless
        run: |
          for f in integration_test/*.dart; do
            echo "== $f"
            xvfb-run -a flutter test "$f" -d linux
          done

  benchmarks:
    name: Benchmarks (recorded, not gated)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # The numbers belong to the runner as much as to the code, so this lane
    # records rather than gates: it keeps every BENCH_JSON line as an
    # artifact, and two runs of the same commit are what a comparison is made
    # from. The properties that *do* survive a change of machine are asserted
    # in the ordinary suites (scaling_test.dart, render_cost_test.dart).
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/native_bridge

      - name: Run the benchmarks
        working-directory: packages/native_bridge
        run: |
          mkdir -p ../../build/benchmarks
          flutter test test/benchmark/tree_build_benchmark.dart \
            | tee ../../build/benchmarks/tree_build.log
          flutter test --platform chrome test/benchmark/web_render_benchmark.dart \
            | tee ../../build/benchmarks/web_render.log
          grep -h '^BENCH_JSON ' ../../build/benchmarks/*.log \
            | sed 's/^BENCH_JSON //' > ../../build/benchmarks/results.jsonl

      - name: Keep the numbers
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/benchmarks/

  web-examples:
    name: Web examples compile
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # The web target is plain dart2js against package:dart_not_native/web.dart,
    # which no other lane compiles: the browser tests exercise the renderer,
    # not the entry points. That let runNativeApp's web signature drift from
    # the Flutter one until every web example stopped building, unnoticed.
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build every web example
        run: maestro/web/build_examples.sh
