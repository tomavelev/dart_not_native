name: Device

# Booting things. An iOS simulator and an Android emulator, each running the
# integration suite and driving the Maestro flows through the real views.
#
# This never runs on a push or a pull request, and that is the point. The two
# lanes take tens of minutes against about three for everything else, and they
# are the only ones that have ever hung - sixteen minutes with no output on a
# simulator that works fine locally. Nobody should wait for that to land a
# change.
#
# What it buys, and what its absence from CI costs: these are the only lanes
# that start the app. A compile cannot see an app that builds and then refuses
# to launch, which is exactly what the iOS 26 UIScene failure was. So run this
# before a release, after a native change you care about, and read the nightly.
#
#   gh workflow run device.yml
#
on:
  schedule:
    # Nightly, so a lane cannot rot unnoticed.
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-device:
    name: Native renderer on an iOS simulator
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E '^ +iPhone' | head -1 \
            | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The flows come first on purpose. They are the half that catches an app
      # which compiles and then will not launch - the UIScene refusal did
      # exactly that - and they should not be blocked by a step that has been
      # unreliable on a CI simulator.
      - name: Device flows on the simulator
        # The only lane that checks a tap or a keystroke *reaches* the app:
        # Maestro drives the real views through the accessibility tree.
        run: maestro/native/run.sh ios --device "$SIMULATOR_UDID"

      # One invocation per file, as the Linux lane does, because
      # `flutter test integration_test` over a directory launches an app per
      # file and has hung here: sixteen minutes on a step that takes seconds
      # of test time locally, with no output after the first Xcode build.
      # Running them separately also says which file stopped, rather than
      # leaving the whole directory silent.
      #
      # The step carries its own ceiling so a hang costs twelve minutes rather
      # than the job's thirty.
      - name: Native renderer on the simulator
        timeout-minutes: 12
        run: |
          for f in integration_test/*.dart; do
            echo "== $f"
            flutter test "$f" -d "$SIMULATOR_UDID"
          done

  android-device:
    name: Native renderer on an Android emulator
    # Same shape as the iOS lane and the same reasoning: booting an emulator,
    # then integration tests, then five flows. It has taken 11 minutes when
    # nothing went wrong.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # The Kotlin and Swift renderers are otherwise only read (the source-level
    # node-type check) and compiled. Neither notices a renderer that builds,
    # dispatches on every type, and then throws when handed one - a wrong
    # LayoutParams, an un-themed context. This lane draws one of every node
    # type and all ten example apps on a real Android, and a native render
    # answers with what it could not draw.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Without KVM the emulator falls back to software rendering and the boot
      # takes long enough to time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Integration tests and device flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Both integration files (the Flutter-hosted app and the native
          # renderer drawing the whole protocol), then the Maestro flows -
          # which are the only thing here that checks a tap or a keystroke
          # *reaches* the app rather than that a view was drawn.
          script: |
            flutter test integration_test
            maestro/native/run.sh android
